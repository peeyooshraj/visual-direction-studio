<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Visual Direction Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a print-shop workbench. Sticky masthead + tabbed workspaces (Brief → Directions → Editor), with Library and History as tools. Editor = vector rows left, proof sheet right. */
:root{
  --paper:#EEF0EA; --surface:#FFFFFF; --sunk:#E4E7DF; --ink:#1A1C29; --muted:#5B6070; --line:#D3D6CC;
  --accent:#E3305C; --accent-ink:#FFFFFF; --blue:#2A3BA8; --blue-soft:#DDE2FA;
  --good:#23794A; --warn:#A86A12; --bad:#B93228;
  --f-display:"Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111219; --surface:#1A1C26; --sunk:#151720; --ink:#ECEDF3; --muted:#A2A6B6; --line:#2D303D;
  --accent:#FF5C82; --accent-ink:#16070C; --blue:#93A4FF; --blue-soft:#232A52;
  --good:#5FCB8E; --warn:#E3AC4E; --bad:#F2766B; color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#111219; --surface:#1A1C26; --sunk:#151720; --ink:#ECEDF3; --muted:#A2A6B6; --line:#2D303D;
  --accent:#FF5C82; --accent-ink:#16070C; --blue:#93A4FF; --blue-soft:#232A52;
  --good:#5FCB8E; --warn:#E3AC4E; --bad:#F2766B; color-scheme:dark;}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}

/* masthead */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;padding-block:12px;flex-wrap:wrap}
.mark{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.01em;position:relative;white-space:nowrap}
.mark span{color:var(--ink);text-shadow:2px 1px 0 color-mix(in srgb,var(--accent) 70%,transparent),-1px -1px 0 color-mix(in srgb,var(--blue) 55%,transparent)}
.mark small{font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--muted);margin-left:8px;letter-spacing:.06em}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav.tabs a{font-family:var(--f-mono);font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;text-decoration:none;color:var(--muted);padding:7px 11px;border-radius:var(--r);border:1px solid transparent}
nav.tabs a:hover{color:var(--ink);border-color:var(--line)}
nav.tabs a[aria-current="page"]{color:var(--accent-ink);background:var(--accent)}
nav.tabs .sep{width:1px;background:var(--line);margin:4px 6px}

main{padding-block:28px 64px}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.lede{color:var(--muted);max-width:68ch;margin:8px 0 0}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.pagehead h1{font-size:clamp(28px,4vw,44px);font-weight:800;letter-spacing:-.02em}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:var(--r);cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.blue{background:var(--blue);color:var(--surface);border-color:var(--blue)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
label.f{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.hint{font-size:12.5px;color:var(--muted)}
textarea,input[type=text],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:9px 11px}
textarea{resize:vertical;min-height:120px;line-height:1.5}
select{padding:7px 9px}

/* brief */
.brief-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fields .full{grid-column:1/-1}
.interp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.interp div{border-top:2px solid var(--ink);padding-top:8px}
.interp b{display:block;font-family:var(--f-display);font-size:18px;font-weight:700;margin-top:2px}
.status{font-size:13px;color:var(--muted);min-height:20px}
.status.err{color:var(--bad)}
.claude-note{font-size:12.5px;color:var(--muted);border-left:3px solid var(--blue);padding:4px 10px;margin-top:12px}

/* directions */
.dir-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.dcard canvas{display:block;width:100%;background:var(--sunk)}
.dcard .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.dcard h3{font-size:21px;font-weight:700}
.dcard .concept{font-weight:500}
.dcard .why{font-size:13.5px;color:var(--muted)}
.picklist{list-style:none;padding:0;margin:0;font-size:13px;border-top:1px solid var(--line)}
.picklist li{display:grid;grid-template-columns:118px 1fr;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
.picklist li span:first-child{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:2px}
.swatches{display:flex;gap:0;border-radius:4px;overflow:hidden;height:22px;border:1px solid var(--line)}
.swatches i{flex:1}
.tag{display:inline-block;font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;padding:2px 7px;border-radius:99px;background:var(--blue-soft);color:var(--blue)}
.tag.rec{background:var(--accent);color:var(--accent-ink)}
.tag.ex{background:var(--sunk);color:var(--muted);border:1px dashed var(--line)}

/* editor */
.ed-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
.vrows{display:flex;flex-direction:column;gap:10px}
.vrow{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
.vrow.locked{border-color:var(--blue);box-shadow:inset 3px 0 0 var(--blue)}
.vrow.design{background:color-mix(in srgb,var(--surface) 85%,var(--blue-soft))}
.vrow .fam{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vrow .fam .eyebrow{color:var(--muted)}
.vrow select{font-family:var(--f-display);font-weight:700;font-size:17px;border:none;padding:2px 0;background:transparent;width:auto;max-width:100%}
.vrow .acts{display:flex;gap:4px;align-items:flex-start}
.vrow .full{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;border:1px solid var(--line);background:transparent;border-radius:99px;padding:3px 10px;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip:hover{border-color:var(--ink)}
.intens{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.intens input{flex:1;accent-color:var(--accent)}
.intens output{font-family:var(--f-mono);min-width:92px;text-align:right;color:var(--ink)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);width:32px;height:32px;display:grid;place-items:center;cursor:pointer;padding:0}
.iconbtn:hover{border-color:var(--ink)}
.iconbtn[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--surface)}
.iconbtn svg{width:16px;height:16px}
.side{display:flex;flex-direction:column;gap:16px}
.proof canvas{width:100%;display:block;border-radius:6px;background:var(--sunk)}
.score{display:flex;align-items:center;gap:12px}
.score .num{font-family:var(--f-display);font-size:38px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.meter{flex:1;height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--good)}
.rels{list-style:none;padding:0;margin:10px 0 0;font-size:13px;display:flex;flex-direction:column;gap:6px}
.rels li{display:grid;grid-template-columns:22px 1fr;gap:6px}
.rels .k{font-family:var(--f-mono);font-weight:600;text-align:center;border-radius:4px}
.k.plus{color:var(--good)} .k.tilde{color:var(--warn)} .k.x{color:var(--bad)}
pre.out{white-space:pre-wrap;word-break:break-word;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:12px;font-family:var(--f-mono);font-size:12.5px;line-height:1.55;margin:0;max-height:420px;overflow:auto}
.ans{white-space:pre-wrap;font-size:14px;background:var(--sunk);border-radius:var(--r);padding:12px;margin-top:10px;max-height:360px;overflow:auto}
.ans:empty{display:none}
.subtabs{display:flex;gap:4px;margin-bottom:10px}
.subtabs button{font-family:var(--f-mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;border:1px solid var(--line);background:transparent;border-radius:var(--r);padding:5px 9px;cursor:pointer;color:var(--muted)}
.subtabs button[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dirtitle input{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,3vw,34px);border:none;background:transparent;padding:0;letter-spacing:-.015em}
.pal{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pal label{display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.pal input[type=color]{width:44px;height:30px;border:1px solid var(--line);border-radius:4px;padding:0;background:none;cursor:pointer}
.toggle{display:flex;gap:8px;align-items:center;font-size:13px}
.toggle input{accent-color:var(--blue)}
.filebox{display:flex;align-items:center;gap:10px;font-size:13px;flex-wrap:wrap}
.filebox img{width:56px;height:56px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}

/* library */
.lib-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px;align-items:start}
.libstats{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.libstats b{font-family:var(--f-display);font-size:26px;color:var(--ink);font-weight:800;margin-right:4px}
.domain{margin-top:18px}
.domain h2{font-size:13px;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--accent);margin-bottom:8px}
.fam-block{border-top:1px solid var(--line);padding:10px 0}
.fam-block h3{font-size:16px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.fam-block h3 small{font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--muted)}
.stylebtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.stylebtn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:4px 9px;font-size:13px;cursor:pointer}
.stylebtn:hover{border-color:var(--ink)}
.stylebtn[aria-current="true"]{background:var(--blue);color:var(--surface);border-color:var(--blue)}
.stylebtn.inuse{box-shadow:inset 0 -2px 0 var(--accent)}
.detail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
.detail h2{font-size:32px;font-weight:800;letter-spacing:-.02em}
.detail .effect{font-size:16px;margin:6px 0 14px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;font-size:13.5px;margin:14px 0}
.kv dt{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding-top:2px}
.kv dd{margin:0}

/* history */
.vlist{display:flex;flex-direction:column;gap:8px}
.vitem{display:grid;grid-template-columns:28px 64px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.vitem canvas{width:64px;border-radius:4px;display:block}
.vitem .meta{font-size:12.5px;color:var(--muted);font-family:var(--f-mono)}
.vitem b{font-family:var(--f-display);font-size:16px}
table.diff{width:100%;border-collapse:collapse;font-size:13.5px}
table.diff th,table.diff td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.diff th{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:500}
tr.chg td{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.tblwrap{overflow-x:auto}
.empty{border:1px dashed var(--line);border-radius:10px;padding:28px;text-align:center;color:var(--muted)}

@media (max-width:900px){
  .brief-grid,.ed-grid,.lib-grid{grid-template-columns:minmax(0,1fr)}
  .side,.detail{position:static}
  nav.tabs{margin-left:0;width:100%}
}
@media (max-width:520px){
  .fields{grid-template-columns:1fr}
  .interp{grid-template-columns:1fr}
  .picklist li{grid-template-columns:96px 1fr}
  .vitem{grid-template-columns:24px 48px minmax(0,1fr)}
  .vitem .vacts{grid-column:1/-1}
  .vitem canvas{width:48px}
  .kv{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="mark"><span>Visual Direction Studio</span><small>V1.0</small></div>
    <nav class="tabs" aria-label="Workspaces">
      <a href="#brief">Brief</a>
      <a href="#directions">Directions</a>
      <a href="#editor">Editor</a>
      <span class="sep" aria-hidden="true"></span>
      <a href="#library">Library</a>
      <a href="#history">History</a>
    </nav>
  </div>
</header>
<main class="wrap" id="app"></main>

<script>
/* ============================================================
   1. TECHNIQUE ATLAS  (domain > family > style > sub-techniques)
   Family line: id|Name|layer(image|design)|param;param
   Style line:  id|Name|Effect|technique;technique;...
   ============================================================ */
const ATLAS_SRC = {
"Composition & space": `
composition|Composition|image|Balance tension;Density;Margins

 negative-space|Negative-space dominant|Quiet focus and premium restraint|Single small focal point;70% empty field;Isolated subject;Sparse caption
 frame-in-frame|Frame within frame|Depth and focus through an opening|Doorway frame;Window frame;Arch frame;Nested frames;Silhouetted foreground frame
 full-bleed|Full-bleed cinematic|Immersion; the image runs edge to edge|Edge-to-edge image;Letterbox bars;Integrated title;Horizon band
 bento|Modular bento|Structured storytelling in panels|Asymmetric cards;Hero panel;Info tiles;Image/type alternation;Gutter rhythm
 triangular|Triangular|Stability or ascent through a pyramid structure|Pyramid group;Inverted-triangle tension;Apex focal point
 repetition|Pattern repetition|Many units read as one identity|Grid of repeats;Rhythm break;Odd one out;Tessellation
perspective|Perspective & viewpoint|image|Angle severity;Horizon height
 eye-level|Eye level|Honest, documentary, relatable|Straight-on view;Centred horizon;Neutral lens
 birds-eye|Bird's-eye|Overview; the pattern and order of a place|High angle;Overhead pattern;Map-like reading;Tiny figures
 worms-eye|Worm's-eye|Heroism and monumentality|Low angle;Towering subject;Sky backdrop;Converging verticals
 isometric|Isometric 2.5D|Collectible, diagrammatic world-building|30° axes;No vanishing point;Cutaway sections;Miniature world;Stacked tiers
 dutch|Dutch angle|Unease, tension, energy|Tilted horizon;Canted frame;Diagonal verticals

layering|Layering architecture|image|Number of planes;Depth separation;Overlap

 flat-layers|Flat graphic layers|Poster clarity with no depth illusion|Hard-edged planes;Overprint;Shape stacking
 type-layer|Typographic layering|Type and image interleaved in depth|Type behind subject;Type over subject;Ghosted repeated type
 translucent|Translucent planes|Modern, glassy, airy|Frosted glass;Overlapping tints;Blur behind panels
 parallax|Parallax stack|Built for motion; depth by offset|Separated plates;Offset layers;Depth-scaled blur
 cutout-overlap|Overlapping cut-outs|Tactile collage-like assembly|Cut silhouettes;Shadowed overlaps;Misaligned stacking
framing|Framing & crop|image|Crop tightness
 natural-frame|Natural framing|Organic enclosure|Foliage frame;Crowd frame;Cloud gap
 arch-frame|Architectural framing|A frame borrowed from the place itself|Pillars;Arches;Stadium roof lines;Temple tower silhouette
 shape-frame|Shape-based frame|Graphic enclosure|Circle crop;Arch crop;Badge shape;Ticket-stub shape
 extreme-crop|Extreme crop|Intimacy and force; a part stands for the whole|Eyes only;Hands detail;Cropped helmet;Off-frame action
 vignette|Vignette|Focus and nostalgia|Darkened edges;Oval fade;Light falloff
subject|Subject treatment|image|Subject scale;Subject dominance
 portrait-large|Large photographic portrait|Human connection; a recognisable hero|Head and shoulders;Three-quarter turn;Direct gaze;Profile
 silhouette|Silhouette|Iconic form, anonymity, universality|Backlit outline;Filled silhouette;Negative silhouette;Rim edge

 object-symbol|Object as symbol|Story told through one object|Hero object;Worn object;Object close-up;Object as relic

camera|Camera & lens|image|Aperture;Focal length

 tele|Telephoto compression|Flattened layers, dense crowds|200mm compression;Stacked background;Shallow depth
 macro|Macro|Hidden detail and texture|Extreme close-up;Texture detail;Razor-thin focus
 fisheye|Fisheye|Playful street energy|Curved horizon;Bulging centre;Circular frame
 tiltshift|Tilt-shift|A miniature-world effect|Focus band;Toy-like scale;Saturated colour
 anamorphic|Anamorphic cinema|Widescreen film look|Oval bokeh;Horizontal flares;2.39:1 frame

layout|Layout language|design|Density
 editorial-mag|Magazine editorial|Premium, journalistic|Cover masthead;Feature spread;Pull quote;Captions;Kicker labels

const FAMILIES = [], STYLES = {}, FAMILY = {};
for (const [domain, src] of Object.entries(ATLAS_SRC)) {
  let fam = null;
  for (const raw of src.split("\n")) {
    if (!raw.trim()) continue;
    const parts = raw.trim().split("|");
    if (!raw.startsWith(" ")) {
      fam = { id: parts[0], name: parts[1], layer: parts[2], params: parts[3].split(";"), domain, styles: [] };
      FAMILIES.push(fam); FAMILY[fam.id] = fam;
    } else {
      const s = { id: parts[0], name: parts[1], effect: parts[2], techs: parts[3].split(";"), family: fam.id };
      fam.styles.push(s.id); STYLES[s.id] = s;
    }
  }
}
const DOMAINS = Object.keys(ATLAS_SRC);
const TOTAL_TECHS = Object.values(STYLES).reduce((n, s) => n + s.techs.length, 0);

  const text = (b.idea + " " + (b.emotion || "") + " " + (b.character || "")).toLowerCase();
  const avoid = (b.avoid || "").toLowerCase();
  const scored = ARCHETYPES.map((a, i) => {
    let s = a.keys.reduce((n, k) => n + (text.includes(k) ? 2 : 0), 0) + (4 - Math.min(i, 4)) * .1;
    for (const p of Object.values(a.d.picks)) { const st = STYLES[p.style]; if (avoid && (avoid.includes(st.name.toLowerCase()) || st.techs.some(t => avoid.includes(t.toLowerCase())))) s -= 3; }
    return { s, d: a.d };

}
function offlineBrief(b) {
  const t = b.idea.toLowerCase();
  const emo = [["pride", "Pride"], ["belong", "Belonging"], ["nostalg", "Nostalgia"], ["joy", "Joy"], ["calm", "Calm"], ["anger", "Defiance"], ["hope", "Hope"], ["emotion", "Emotional"], ["energy", "Energy"]].filter(([k]) => t.includes(k)).map(x => x[1]);
  const chr = [["premium", "Premium"], ["editorial", "Editorial"], ["playful", "Playful"], ["raw", "Raw"], ["minimal", "Minimal"], ["cultur", "Culturally grounded"], ["cinematic", "Cinematic"]].filter(([k]) => t.includes(k)).map(x => x[1]);
  return { subject: b.subject || b.idea.split(/[.,]/)[0].slice(0, 60), message: b.message || "", emotion: emo.join(" + ") || b.emotion || "", character: chr.join(" + ") || b.character || "" };
}
/* natural-language tweak parser (no Claude) */
function findStyles(text) {
  const t = text.toLowerCase(), hits = [];
  for (const s of Object.values(STYLES)) { const n = s.name.toLowerCase().replace(/[()]/g, ""); const i = t.indexOf(n.split(" / ")[0]); if (i >= 0) hits.push({ s, i }); }
  return hits.sort((a, b) => a.i - b.i || b.s.name.length - a.s.name.length).filter((h, k, arr) => !arr.some((o, j) => j !== k && o.i <= h.i && o.i + o.s.name.length >= h.i + h.s.name.length && o.s.name.length > h.s.name.length));
}
function offlineRevise(text) {
  const ops = [], t = text.toLowerCase();
  for (const clause of t.split(/[.;]|\band\b(?= (?:remove|replace|reduce|increase|swap|add|drop|more|less))/)) {
    const hits = findStyles(clause);
    if (!hits.length) continue;
    if (/replace|swap|instead|change/.test(clause) && hits.length >= 2) {
      const [a, b] = hits;
      if (a.s.family === b.s.family || !S.dir.picks[b.s.family]) { if (a.s.family !== b.s.family) ops.push({ op: "remove", family: a.s.family }); ops.push({ op: "replace", family: b.s.family, style: b.s.id }); }
    } else if (/remove|drop|without|no /.test(clause)) hits.forEach(h => ops.push({ op: "remove", family: h.s.family }));
    else if (/reduce|less|subtle|lower|tone down/.test(clause)) hits.forEach(h => ops.push({ op: "intensity", family: h.s.family, delta: -25 }));
    else if (/increase|more|stronger|dominant|boost/.test(clause)) hits.forEach(h => ops.push({ op: "intensity", family: h.s.family, delta: 25 }));
    else if (/add|use|try/.test(clause)) hits.forEach(h => ops.push({ op: "replace", family: h.s.family, style: h.s.id }));
  }
  return ops;
}
function applyOps(ops) {
  const done = [], skipped = [];
  for (const o of ops) {
    const fam = FAMILY[o.family]; if (!fam) continue;
    const cur = S.dir.picks[o.family];
    if (cur?.locked) { skipped.push(fam.name + " (locked)"); continue; }
    if (o.op === "remove" && cur) { delete S.dir.picks[o.family]; done.push("removed " + STYLES[cur.style].name); }
    else if (o.op === "replace" && STYLES[o.style]?.family === o.family) {
      const st = STYLES[o.style];
      const techs = (o.techniques || []).filter(x => st.techs.includes(x));
      S.dir.picks[o.family] = { style: o.style, techs: techs.length ? techs : st.techs.slice(0, 2), intensity: clampI(o.intensity ?? cur?.intensity ?? 55), locked: false };
      done.push((cur ? STYLES[cur.style].name + " → " : "added ") + st.name);
    } else if (o.op === "intensity" && cur) {
      cur.intensity = clampI(o.intensity ?? cur.intensity + (o.delta || 0)); done.push(STYLES[cur.style].name + " → " + level(cur.intensity));
    } else if (o.op === "techniques" && cur) {
      const techs = (o.techniques || []).filter(x => STYLES[cur.style].techs.includes(x)); if (techs.length) { cur.techs = techs; done.push(STYLES[cur.style].name + " sub-techniques"); }
    }

}
const clampI = v => Math.max(0, Math.min(100, Math.round(Number(v) || 0)));

function cleanDirection(raw) {
  const picks = {};
  for (const p of raw.picks || []) {
    const st = STYLES[p.style]; if (!st) continue;
    const fam = st.family; if (picks[fam]) continue;
    const techs = (p.techniques || []).filter(x => st.techs.includes(x));

      <button class="iconbtn" data-lock aria-pressed="${p.locked}" title="${p.locked ? "Unlock" : "Lock"} ${esc(f.name)}" aria-label="Lock ${esc(f.name)}">${ICON.lock}</button>
      <button class="iconbtn" data-reroll title="Try another ${esc(f.name)}" aria-label="Randomise ${esc(f.name)}" ${p.locked ? "disabled" : ""}>${ICON.dice}</button>
      <button class="iconbtn" data-remove title="Remove ${esc(f.name)}" aria-label="Remove ${esc(f.name)}" ${p.locked ? "disabled" : ""}>${ICON.x}</button>
    </div>
    <div class="chips full">${s.techs.map(t => `<button class="chip" data-tech="${esc(t)}" aria-pressed="${p.techs.includes(t)}" ${p.locked ? "disabled" : ""}>${esc(t)}</button>`).join("")}</div>
    <div class="intens full"><label for="int-${fid}">Subtle</label><input type="range" id="int-${fid}" min="0" max="100" value="${p.intensity}" data-int ${p.locked ? "disabled" : ""}><span>Dominant</span><output>${p.intensity}% · ${level(p.intensity)}</output></div>
  </div>`;
}
function randomStyleFor(fid, keepIds) {
  const f = FAMILY[fid];
  const bad = new Set(RULES.filter(r => r[2] === "x").flatMap(r => keepIds.includes(r[0]) ? [r[1]] : keepIds.includes(r[1]) ? [r[0]] : []));
  const good = new Set(RULES.filter(r => r[2] === "+").flatMap(r => keepIds.includes(r[0]) ? [r[1]] : keepIds.includes(r[1]) ? [r[0]] : []));
  const pool = f.styles.filter(id => !bad.has(id) && id !== S.dir.picks[fid]?.style);
  const pref = pool.filter(id => good.has(id));
  const list = pref.length && Math.random() < .6 ? pref : pool;
  const id = list[Math.floor(Math.random() * list.length)] || f.styles[0];
  const techs = [...STYLES[id].techs].sort(() => Math.random() - .5).slice(0, 2);
  return { style: id, techs };
}
function bindEditor() {
  const d = S.dir;
  $("#dname").addEventListener("change", e => { snapshot(); d.name = e.target.value || "Untitled"; render(); });
  $("#dconcept").addEventListener("change", e => { d.concept = e.target.value; render(); });
  $("#undo").addEventListener("click", () => { if (undoStack.length) { S.dir = undoStack.pop(); render(); } });
  $("#rand").addEventListener("click", () => {
    snapshot();
    const keep = Object.values(d.picks).filter(p => p.locked).map(p => p.style);
    for (const [fid, p] of Object.entries(d.picks)) if (!p.locked) { const r = randomStyleFor(fid, keep); Object.assign(p, r); keep.push(r.style); }
    render();
  });
  $("#savev").addEventListener("click", () => {
    S.versions.push({ id: uid(), t: Date.now(), label: S.note ? S.note.slice(0, 80) : "Saved “" + d.name + "”", dir: clone(d) });
    const b = $("#savev"); render(); const nb = $("#savev"); if (nb) { nb.textContent = "Saved"; setTimeout(() => { if ($("#savev")) $("#savev").textContent = "Save version"; }, 1400); }
  });
  $("#lockPal").addEventListener("change", e => { d.paletteLocked = e.target.checked; save(); });
  app.querySelectorAll("[data-pal]").forEach(inp => inp.addEventListener("change", e => { snapshot(); d.palette[+inp.dataset.pal] = e.target.value; render(); }));
  app.querySelectorAll(".vrow").forEach(row => {
    const fid = row.dataset.fam, p = d.picks[fid];
    row.querySelector("[data-style]").addEventListener("change", e => { snapshot(); p.style = e.target.value; p.techs = STYLES[p.style].techs.slice(0, 2); render(); });
    row.querySelector("[data-lock]").addEventListener("click", () => { p.locked = !p.locked; render(); });
    row.querySelector("[data-remove]").addEventListener("click", () => { snapshot(); delete d.picks[fid]; render(); });
    row.querySelector("[data-reroll]").addEventListener("click", () => { snapshot(); const keep = Object.entries(d.picks).filter(([f]) => f !== fid).map(([, q]) => q.style); Object.assign(p, randomStyleFor(fid, keep)); render(); });
    row.querySelectorAll("[data-tech]").forEach(c => c.addEventListener("click", () => { snapshot(); const t = c.dataset.tech; p.techs = p.techs.includes(t) ? p.techs.filter(x => x !== t) : [...p.techs, t]; render(); }));
    const rg = row.querySelector("[data-int]");
    rg.addEventListener("input", () => { p.intensity = +rg.value; row.querySelector("output").textContent = rg.value + "% · " + level(+rg.value); drawBoard($("#board"), d); });
    rg.addEventListener("change", () => { snapshot(); render(); });
  });
  $("#addFam").addEventListener("change", e => { const fid = e.target.value; if (!fid) return; snapshot(); const keep = Object.values(d.picks).map(p => p.style); d.picks[fid] = { ...randomStyleFor(fid, keep), intensity: 50, locked: false }; render(); });
  app.querySelectorAll("[data-side]").forEach(b => b.addEventListener("click", () => { sideTab = b.dataset.side; render(); }));
  app.querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", () => copyFrom(b.dataset.copy, b)));
  $("#noType")?.addEventListener("change", e => { S.noTypeInImage = e.target.checked; render(); });
  $("#polish")?.addEventListener("click", polishPrompt);
  const note = $("#note");
  if (note) note.addEventListener("input", () => { S.note = note.value; save(); $("#revOut").textContent = revisionSpec(); });
  $("#applyRev")?.addEventListener("click", () => applyRevision(!!sample));
  $("#applyLocal")?.addEventListener("click", () => applyRevision(false));
  $("#revImg")?.addEventListener("change", e => { const f = e.target.files?.[0]; if (f) { if (revImage) URL.revokeObjectURL(revImage.url); revImage = { file: f, url: URL.createObjectURL(f) }; render(); } });
  $("#clearImg")?.addEventListener("click", () => { URL.revokeObjectURL(revImage.url); revImage = null; render(); });
  $("#askBtn")?.addEventListener("click", askClaude);
}
async function copyFrom(id, btn) {
  const el = $("#" + id); if (!el) return;
  try { await navigator.clipboard.writeText(el.textContent); btn.textContent = "Copied"; }
  catch { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = "Selected — press Ctrl/⌘ C"; }
  setTimeout(() => { if (btn.isConnected) btn.textContent = btn.dataset.copy === "promptOut" ? "Copy prompt" : btn.dataset.copy === "designOut" ? "Copy design spec" : "Copy revision spec"; }, 1600);
}
async function applyRevision(useClaude) {
  const st = $("#revStatus"); S.note = $("#note").value;
  if (!S.note.trim() && !revImage) { st.className = "status err"; st.textContent = "Describe what to change first."; return; }
  const before = clone(S.dir);
  if (!useClaude) {
    const ops = offlineRevise(S.note);
    if (!ops.length) { st.className = "status err"; st.textContent = "No technique names found in the note. Name them as they appear in the rows, e.g. “remove halftone”."; return; }
    snapshot(); const r = applyOps(ops);
    finishRevision(before, r, "");
    return;
  }
  const btn = $("#applyRev"); btn.disabled = true; st.className = "status"; st.textContent = "Claude is revising the direction…";
  try {
    const prompt = `You are revising an art direction. Change only what the feedback asks for; never touch LOCKED families${S.dir.paletteLocked ? " or the palette (it is locked)" : ""}.

CURRENT DIRECTION:
${dirAsText(S.dir)}

BRIEF: ${S.brief.idea}
FEEDBACK: ${S.note || "(see attached image)"}
${revImage ? "The attached image is the output generated from this direction. Compare it to the direction and the feedback, and fix what is not working." : ""}

LIBRARY:
${catalog()}

Reply with only JSON:
{"summary":"one sentence: what you changed and why",
 "ops":[{"op":"replace","family":"family id","style":"style id","techniques":["exact names"],"intensity":0-100},{"op":"remove","family":"family id"},{"op":"intensity","family":"family id","intensity":0-100},{"op":"techniques","family":"family id","techniques":["exact names"]}],
 "palette":null,
 "promptNote":"one short instruction for the image generator, or empty"}
Use "palette":["#hex","#hex","#hex","#hex"] only if colour must change.`;
    const opts = { modelTier: "default", cache: false };
    if (revImage) opts.images = [revImage.file];
    const out = await sample.json(prompt, opts);
    snapshot();
    const r = applyOps(Array.isArray(out?.ops) ? out.ops : []);
    if (Array.isArray(out?.palette) && !S.dir.paletteLocked && out.palette.every(c => /^#[0-9a-f]{6}$/i.test(c)) && out.palette.length === 4) { S.dir.palette = out.palette; r.done.push("new palette"); }
    if (out?.promptNote) S.note = String(out.promptNote);
    finishRevision(before, r, out?.summary || "");
  } catch (e) {
    st.className = "status err"; st.textContent = sampleErr(e);
    if (["not_granted", "images_unavailable"].includes(e?.code)) { if (e.code === "not_granted") sample = null; }
  } finally { if (btn.isConnected) btn.disabled = false; }
}
function finishRevision(before, r, summary) {
  const label = summary || ("Tweak: " + (r.done.join(", ") || "no change"));
  S.versions.push({ id: uid(), t: Date.now(), label: label.slice(0, 120), dir: clone(S.dir), note: S.note });
  render();
  const st = $("#revStatus");
  if (st) { st.className = r.done.length ? "status" : "status err"; st.textContent = (r.done.length ? "Changed: " + r.done.join(", ") + "." : "Nothing changed.") + (r.skipped.length ? " Skipped: " + r.skipped.join(", ") + "." : "") + " Saved as a new version."; }
}
let askCtl = null;
async function askClaude() {
  const out = $("#askOut"), q = $("#askq").value.trim(); if (!q) return;
  askCtl = new AbortController(); $("#askBtn").disabled = true; $("#askStop").hidden = false; $("#askStop").onclick = () => askCtl.abort();
  out.textContent = "Thinking…";
  try {
    await sample(`You are an art director teaching a designer. Answer plainly and specifically about this direction, in under 220 words. Refer to techniques by name. If asked about a swap, say what changes visually and emotionally and what stays.

BRIEF: ${S.brief.idea}
DIRECTION:
${dirAsText(S.dir)}

QUESTION: ${q}`, { signal: askCtl.signal, onText: ({ text }) => { out.textContent = text; } });
  } catch (e) { out.textContent = (e.text || "") + (e.code === "cancelled" ? "" : "\n\n" + sampleErr(e)); }
  finally { if ($("#askBtn")) { $("#askBtn").disabled = false; $("#askStop").hidden = true; } }
}
async function polishPrompt() {
  const out = $("#polishOut"), comp = compile(); out.textContent = "Thinking…";
  try {
    await sample(`Rewrite this art-direction spec as one vivid, precise image-generation prompt (120-180 words, natural language, describe the picture, not the process). Keep every technique and the hex palette. End with a line "Avoid: ...".\n\n${comp.prompt}\nAvoid: ${comp.avoid}`,
      { onText: ({ text }) => { out.textContent = text; } });
  } catch (e) { out.textContent = (e.text || "") + "\n\n" + sampleErr(e); }
}

/* ---- Library ---- */
function viewLibrary() {
  const q = libQ.toLowerCase();
  const match = s => !q || (s.name + " " + s.effect + " " + s.techs.join(" ") + " " + FAMILY[s.family].name).toLowerCase().includes(q);
  const inUse = new Set(Object.values(S.dir.picks).map(p => p.style));
  const sel = STYLES[libSel] || STYLES["double-exposure"], fam = FAMILY[sel.family];
  const rel = RULES.filter(r => (r[0] === sel.id || r[1] === sel.id) && r[3]).map(r => ({ other: STYLES[r[0] === sel.id ? r[1] : r[0]], k: r[2], note: r[3] }));
  const cur = S.dir.picks[fam.id];
  app.innerHTML = `
  <div class="pagehead"><div><div class="eyebrow">Technique atlas</div><h1>Vector library</h1>
    <p class="libstats" style="margin-top:10px"><b>${FAMILIES.length}</b>families · <b>${Object.keys(STYLES).length}</b>styles · <b>${TOTAL_TECHS}</b>sub-techniques · <b>${RULES.filter(r => r[3]).length}</b>relationships</p></div>
    <div style="min-width:260px;flex:0 1 360px"><label class="f" for="libq">Search techniques</label><input type="text" id="libq" value="${esc(libQ)}" placeholder="halftone, silhouette, golden hour…"></div></div>
  <div class="lib-grid">
    <section>${DOMAINS.map(dm => {
      const fams = FAMILIES.filter(f => f.domain === dm && f.styles.some(id => match(STYLES[id])));
      if (!fams.length) return "";
      return `<div class="domain"><h2>${dm}</h2>${fams.map(f => `<div class="fam-block"><h3>${esc(f.name)} <small>${f.styles.length} styles · ${f.layer === "design" ? "design layer" : "image layer"}</small></h3>
        <div class="stylebtns">${f.styles.filter(id => match(STYLES[id])).map(id => `<button class="stylebtn ${inUse.has(id) ? "inuse" : ""}" data-sel="${id}" aria-current="${id === sel.id}">${esc(STYLES[id].name)}</button>`).join("")}</div></div>`).join("")}</div>`;
    }).join("") || `<div class="empty">Nothing matches “${esc(libQ)}”.</div>`}
    <p class="hint" style="margin-top:14px">An underline marks techniques used in the current direction.</p></section>
    <aside class="panel detail">
      <div class="eyebrow">${esc(fam.domain)} · ${esc(fam.name)}</div>
      <h2 style="margin-top:6px">${esc(sel.name)}</h2>
      <p class="effect">${esc(sel.effect)}</p>
      <span class="tag">${fam.layer === "design" ? "Design layer: stays editable, not generated" : "Image layer: generated into the artwork"}</span>
      <dl class="kv">
        <dt>Sub-techniques</dt><dd><div class="chips">${sel.techs.map(t => `<span class="chip" style="cursor:default">${esc(t)}</span>`).join("")}</div></dd>
        <dt>Parameters</dt><dd>${fam.params.map(esc).join(" · ")} · Intensity</dd>
        <dt>Works with</dt><dd>${rel.filter(r => r.k === "+").map(r => `<b>${esc(r.other.name)}</b> — ${esc(r.note)}`).join("<br>") || `<span class="hint">No recorded pairings yet.</span>`}</dd>
        <dt>Productive tension</dt><dd>${rel.filter(r => r.k === "~").map(r => `<b>${esc(r.other.name)}</b> — ${esc(r.note)}`).join("<br>") || `<span class="hint">—</span>`}</dd>
        <dt>Conflicts</dt><dd>${rel.filter(r => r.k === "x").map(r => `<b>${esc(r.other.name)}</b> — ${esc(r.note)}`).join("<br>") || `<span class="hint">—</span>`}</dd>
        <dt>Other ${esc(fam.name.toLowerCase())}</dt><dd>${fam.styles.filter(id => id !== sel.id).map(id => `<a href="#library" data-sel="${id}">${esc(STYLES[id].name)}</a>`).join(", ")}</dd>
      </dl>
      <div class="row">
        <button class="btn primary" id="useStyle" ${cur?.locked ? "disabled" : ""}>${cur ? (cur.style === sel.id ? "In the current direction" : "Replace " + esc(STYLES[cur.style].name)) : "Add to current direction"}</button>
        ${sample ? `<button class="btn" id="teach">Teach me this technique</button>` : ""}
      </div>
      ${cur?.locked ? `<p class="hint" style="margin-top:6px">${esc(fam.name)} is locked in the editor.</p>` : ""}
      <div class="ans" id="teachOut"></div>
    </aside>
  </div>`;
  const qi = $("#libq");
  qi.addEventListener("input", () => { libQ = qi.value; const pos = qi.selectionStart; viewLibrary(); const n = $("#libq"); n.focus(); n.setSelectionRange(pos, pos); });
  app.querySelectorAll("[data-sel]").forEach(b => b.addEventListener("click", e => { e.preventDefault(); libSel = b.dataset.sel; viewLibrary(); }));
  $("#useStyle").addEventListener("click", () => {
    if (cur?.style === sel.id) { go("editor"); return; }
    snapshot(); S.dir.picks[fam.id] = { style: sel.id, techs: sel.techs.slice(0, 2), intensity: cur?.intensity ?? 50, locked: false }; save(); go("editor");
  });
  $("#teach")?.addEventListener("click", async () => {
    const out = $("#teachOut"); out.textContent = "Thinking…";
    try {
      await sample(`Teach the visual technique "${sel.name}" (${fam.name}) to a designer learning art direction. Use these short labelled sections: What it is; What it looks like; What problem it solves; When to use it; Variations (use: ${sel.techs.join(", ")}); Pairs well with; Three applications (one sentence each). Under 260 words, plain language.`,
        { cache: { gcTime: 86400000 }, onText: ({ text }) => { out.textContent = text; } });
    } catch (e) { out.textContent = (e.text || "") + "\n\n" + sampleErr(e); }
  });
}

/* ---- History ---- */
function viewHistory() {
  const V = S.versions;
  if (!cmpA && V.length > 1) { cmpA = V[V.length - 2].id; cmpB = V[V.length - 1].id; }
  const A = V.find(v => v.id === cmpA), B = V.find(v => v.id === cmpB);
  app.innerHTML = `
  <div class="pagehead"><div><div class="eyebrow">Iteration & version history</div><h1>Versions</h1>
    <p class="lede">Every opened direction, saved version and applied tweak is recorded here. Tick A and B to compare, or restore any version into the editor.</p></div>
    <button class="btn ghost" id="clearH" ${V.length > 1 ? "" : "disabled"}>Clear history</button></div>
  ${V.length ? `<div class="vlist">${V.slice().reverse().map((v, ri) => { const i = V.length - 1 - ri; return `
    <div class="vitem"><span class="eyebrow">v${i + 1}</span><canvas data-v="${i}"></canvas>
      <div style="min-width:0"><b>${esc(v.dir.name)}</b><div>${esc(v.label)}</div><div class="meta">${new Date(v.t).toLocaleString()} · ${Object.keys(v.dir.picks).length} vectors · coherence ${coherence(v.dir).score}</div></div>
      <div class="row vacts"><label class="toggle"><input type="radio" name="cmpA" value="${v.id}" ${v.id === cmpA ? "checked" : ""}> A</label><label class="toggle"><input type="radio" name="cmpB" value="${v.id}" ${v.id === cmpB ? "checked" : ""}> B</label>
        <button class="btn sm" data-restore="${i}">Restore</button></div></div>`; }).join("")}</div>` : `<div class="empty">No versions yet. Open a direction or save one from the editor.</div>`}
  ${A && B ? `<div class="panel" style="margin-top:20px"><div class="eyebrow">Compare</div><h2 style="font-size:22px;margin:6px 0 12px">A: ${esc(A.dir.name)} → B: ${esc(B.dir.name)}</h2>
    <div class="tblwrap"><table class="diff"><thead><tr><th>Vector</th><th>A · v${V.indexOf(A) + 1}</th><th>B · v${V.indexOf(B) + 1}</th></tr></thead>
    <tbody>${diffDirs(A.dir, B.dir).map(r => `<tr class="${r.changed ? "chg" : ""}"><td>${esc(r.family)}</td><td>${esc(r.a)}</td><td>${esc(r.b)}</td></tr>`).join("")}</tbody></table></div></div>` : ""}`;
  app.querySelectorAll("canvas[data-v]").forEach(cv => drawBoard(cv, V[cv.dataset.v].dir, S.brief.format, 160));
  app.querySelectorAll("input[name=cmpA]").forEach(r => r.addEventListener("change", () => { cmpA = r.value; viewHistory(); }));
  app.querySelectorAll("input[name=cmpB]").forEach(r => r.addEventListener("change", () => { cmpB = r.value; viewHistory(); }));
  app.querySelectorAll("[data-restore]").forEach(b => b.addEventListener("click", () => { snapshot(); S.dir = clone(V[b.dataset.restore].dir); go("editor"); }));
  $("#clearH").addEventListener("click", function () {
    if (this.dataset.armed) { S.versions = [{ id: uid(), t: Date.now(), label: "History cleared", dir: clone(S.dir) }]; cmpA = cmpB = null; render(); }
    else { this.dataset.armed = 1; this.textContent = "Click again to clear"; }
  });
}

route();
</script>
